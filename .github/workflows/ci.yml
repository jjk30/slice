# Phase 15 CI: install, apply migrations against a real Postgres, run the full
# test suite. Tests only — no build-and-push / deploy / ECR step (that is phase 16).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: slice
          POSTGRES_PASSWORD: slice
          POSTGRES_DB: slice
        ports:
          - 5432:5432
        # Wait until Postgres answers before the steps start.
        options: >-
          --health-cmd "pg_isready -U slice -d slice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://slice:slice@localhost:5432/slice
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Initialize schema and apply migrations
        # Use the app's own startup path (app/db.py) instead of a raw psql loop:
        # Database.connect() runs the SCHEMA constant (which CREATEs the base
        # `requests` table) FIRST, then _run_migrations() applies migrations/*.sql
        # in sorted order. The migrations ALTER those base tables, so they only
        # work after SCHEMA has run. connect() swallows errors and returns False,
        # so exit non-zero on a falsy result to keep a real DB failure red.
        run: |
          python -c "
          import asyncio, sys
          from app.config import DATABASE_URL
          from app.db import Database

          async def main():
              ok = await Database(DATABASE_URL).connect()
              if not ok:
                  sys.exit('Database.connect() returned False: schema/migrations not applied')

          asyncio.run(main())
          "

      - name: Run tests
        run: pytest
