# slice local stack (phase 15): gateway + Postgres + Redis.
#
# Migrations: the gateway applies every file in migrations/ on startup (app/db.py
# runs them when it connects to the db), and those files are baked into the image,
# so a normal `docker compose up` self-migrates once db is healthy. To apply them
# by hand instead — against a bare db, or without booting the app — run:
#
#   cat migrations/*.sql | docker compose exec -T db psql -U slice -d slice
#
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: slice
      POSTGRES_PASSWORD: slice
      POSTGRES_DB: slice
    volumes:
      - slice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slice -d slice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    # All other config (Anthropic key, feature flags, etc.) flows in from .env...
    env_file: .env
    # ...but these two point at the compose services rather than localhost, and
    # `environment` wins over `env_file`, so they override whatever .env says.
    environment:
      DATABASE_URL: postgresql://slice:slice@db:5432/slice
      REDIS_URL: redis://redis:6379

volumes:
  slice_pgdata:
