# Horizontal Pod Autoscaler for the gateway: 2 replicas normally, up to 4 when
# average CPU across the pods passes 70% of the request (250m) — i.e. ~175m/pod.
#
# REQUIRES metrics-server in the cluster, or the HPA cannot read CPU and reports
# `<unknown>` targets and never scales. On kind, install it with `make kind-up`
# (see k8s/kind/), which applies metrics-server with --kubelet-insecure-tls.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: slice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
