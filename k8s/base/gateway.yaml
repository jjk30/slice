# The slice gateway itself: the FastAPI app (uvicorn app.main:app on :8080).
# Stateless — all state lives in Postgres and Redis — so it is a Deployment with
# 2 replicas, and the HPA (gateway-hpa.yaml) can add more under CPU load.
#
# On startup the app self-applies every file in migrations/ against the database
# (app/db.py). Running 2 replicas at once is safe: the migration runner is
# idempotent, so whichever pod connects first migrates and the rest are no-ops.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: slice
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: slice
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Don't start the app until Postgres accepts connections. Without this the
      # gateway would crash-loop a few times on a cold cluster while the db pod
      # is still coming up. busybox's nc is enough to check the port is open.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres:5432..."
                sleep 2
              done
      containers:
        - name: gateway
          image: slice-gateway:local
          # Use the image already loaded into the cluster (kind load / a local
          # build); never go to a registry for it. Override in an overlay when you
          # pull from ECR.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          # Non-secret config as a block...
          envFrom:
            - configMapRef:
                name: slice-config
          # ...and the secrets pulled key-by-key from the generated Secret. The
          # name here is rewritten by kustomize to the hashed generated name.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: slice-secrets
                  key: DATABASE_URL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slice-secrets
                  key: ANTHROPIC_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: slice-secrets
                  key: JWT_SECRET
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slice-secrets
                  key: RESEND_API_KEY
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: slice-secrets
                  key: GITHUB_OAUTH_CLIENT_ID
          # The app has no dedicated /health route; /docs (FastAPI's Swagger UI)
          # always returns 200 once the app is serving, which is exactly what the
          # production ALB health check uses too.
          startupProbe:
            # Covers the slow first boot (dependency import + migrations): up to
            # 30 * 5s = 150s before liveness takes over.
            httpGet:
              path: /docs
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /docs
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /docs
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 750Mi
              cpu: 250m
            limits:
              memory: 1.5Gi
              cpu: 1000m
